name: Supabase wach halten

on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leseanfrage an Supabase
        run: |
          KEY=$(grep -oE '(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+)' assets/supabase-config.js | head -1)
          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            "https://hyzgqwujbarpofctptmm.supabase.co/rest/v1/themen_oeffentlich?limit=1"
